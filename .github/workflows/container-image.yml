name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/container-image.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short
            type=ref,event=tag

      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign container image by digest
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/gpuflow ./cmd/gpuflow
          tar -C build -czf "dist/gpuflow-linux-amd64.tar.gz" gpuflow

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/gpuflow ./cmd/gpuflow
          tar -C build -czf "dist/gpuflow-linux-arm64.tar.gz" gpuflow

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/gpuflow.exe ./cmd/gpuflow
          zip -j "dist/gpuflow-windows-amd64.zip" build/gpuflow.exe

          package_dir="build/gpuflow-deployment-${GITHUB_REF_NAME}"
          mkdir -p "$package_dir"
          cp compose.yaml .env.example LICENSE "$package_dir/"
          cp deploy/README.md "$package_dir/README.md"
          cp README.md "$package_dir/PROJECT-README.md"
          cp -R scripts deploy "$package_dir/"
          chmod +x "$package_dir"/scripts/*.sh
          printf '%s\n' "$GITHUB_REF_NAME" > "$package_dir/VERSION"
          tar -C build -czf "dist/gpuflow-deployment-${GITHUB_REF_NAME}.tar.gz" \
            "gpuflow-deployment-${GITHUB_REF_NAME}"

          cd dist
          sha256sum ./*.tar.gz ./*.zip > checksums.txt

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign release artifacts
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > dist/cosign.pub
          for artifact in dist/*.tar.gz dist/*.zip dist/checksums.txt; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done

      - name: Create or update versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              dist/*.zip dist/*.tar.gz dist/checksums.txt \
              dist/*.sigstore.json dist/cosign.pub \
              --clobber
          else
            gh release create "$VERSION" \
              dist/*.zip dist/*.tar.gz dist/checksums.txt \
              dist/*.sigstore.json dist/cosign.pub \
              --generate-notes \
              --title "GPUFlow $VERSION"
          fi
