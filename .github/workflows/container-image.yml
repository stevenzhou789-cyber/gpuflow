name: Publish

on:
  push:
    branches:
      - main
    tags:
      - stable
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/container-image.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "web/**"
      - "scripts/check-community-boundary*"
      - "scripts/community-release*"
      - "scripts/*package-community-release.py"
      - "scripts/test-community-release-workflow.py"
      - "scripts/*scan-dependencies.py"
      - "scripts/test-build-context.py"
      - "scripts/gitlab-*.Dockerfile.dockerignore"
      - "compose.yaml"
      - ".env.example"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      is_version: ${{ steps.release-ref.outputs.is_version }}
      tag: ${{ steps.release-ref.outputs.tag }}
      tag_object_sha: ${{ steps.release-ref.outputs.tag_object_sha }}
      commit_sha: ${{ steps.release-ref.outputs.commit_sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test version publication and deployment packaging
        run: |
          node --test scripts/community-release.test.mjs
          python3 scripts/test-package-community-release.py
          python3 scripts/test-community-release-workflow.py

      - name: Set up Docker Buildx for context boundary tests
        uses: docker/setup-buildx-action@v4

      - name: Test Docker context boundaries with synthetic fixtures
        run: python3 scripts/test-build-context.py

      - name: Validate version tag origin
        id: release-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/community-release.mjs guard

  dependency-scan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
      - name: Verify report-only dependency policy
        run: python3 scripts/test-scan-dependencies.py
      - name: Record third-party findings without approval
        run: python3 scripts/scan-dependencies.py
      - name: Retain actual dependency reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-scans-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 90

  build:
    needs: [validate, dependency-scan]
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}

      - name: Set up Node.js for Community boundary verification
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify tracked Community product boundary
        run: |
          node --test scripts/check-community-boundary.test.mjs
          node scripts/check-community-boundary.mjs

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,format=short,enable=${{ needs.validate.outputs.is_version != 'true' }}
            type=ref,event=tag,enable=${{ needs.validate.outputs.is_version != 'true' }}
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ needs.validate.outputs.is_version == 'true' }}

      - name: Build and publish multi-platform image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit_sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.tag || steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign container image by digest
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${IMAGE_NAME}@${IMAGE_DIGEST}"

  release:
    if: github.ref == 'refs/tags/stable' || needs.validate.outputs.is_version == 'true'
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify tracked Community release boundary
        run: |
          node --test scripts/check-community-boundary.test.mjs
          node scripts/check-community-boundary.mjs

      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Test
        run: go test ./...

      - name: Verify freshly built Community UI boundary
        run: |
          node scripts/check-community-boundary.mjs --source-tree .

      - name: Build release archives
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux-amd64 build/linux-arm64 build/windows-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/linux-amd64/gpuflow ./cmd/gpuflow
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o build/linux-arm64/gpuflow ./cmd/gpuflow
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/windows-amd64/gpuflow.exe ./cmd/gpuflow
          python3 scripts/package-community-release.py \
            --version "$GITHUB_REF_NAME" --image-repository "$IMAGE_NAME" \
            --image-digest "$IMAGE_DIGEST" --build-dir build --output-dir dist

      - name: Set up Docker Buildx for version image promotion
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign release artifacts
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          cosign public-key --key env://COSIGN_PRIVATE_KEY > dist/cosign.pub
          for artifact in dist/*.tar.gz dist/*.zip dist/checksums.txt; do
            cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
              --bundle "${artifact}.sigstore.json" \
              "$artifact"
          done

      - name: Create or update legacy Stable Release
        if: github.ref == 'refs/tags/stable'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              dist/*.zip dist/*.tar.gz dist/checksums.txt \
              dist/*.sigstore.json dist/cosign.pub \
              --clobber
          else
            gh release create "$VERSION" \
              dist/*.zip dist/*.tar.gz dist/checksums.txt \
              dist/*.sigstore.json dist/cosign.pub \
              --generate-notes \
              --title "GPUFlow $VERSION"
          fi

      - name: Verify and publish immutable Community version
        if: needs.validate.outputs.is_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ needs.build.outputs.image_name }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
          EXPECTED_COMMIT_SHA: ${{ needs.validate.outputs.commit_sha }}
        run: node scripts/community-release.mjs publish --assets-dir dist
