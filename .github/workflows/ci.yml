name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify tracked Community product boundary
        run: |
          node --test scripts/check-community-boundary.test.mjs
          node scripts/check-community-boundary.mjs

      - name: Set up Docker Buildx for context boundary tests
        uses: docker/setup-buildx-action@v4

      - name: Test Docker context boundaries with synthetic fixtures
        run: python3 scripts/test-build-context.py

      - name: Build web interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify freshly built Community UI boundary
        run: |
          node scripts/check-community-boundary.mjs --source-tree .

      - name: Test
        run: go test ./...
