stages:
  - build

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  image: docker:29-cli
  tags:
    - linux-docker
  interruptible: true

variables:
  GOMAXPROCS: "2"
  DOCKER_BUILDKIT: "1"
  # DOCKER_HOST is supplied by the isolated local runner, never a host socket.

development-build:
  stage: build
  resource_group: gpuflow-development-build
  timeout: 1h
  script:
    - sh scripts/gitlab-build.sh
  artifacts:
    name: "gpuflow-development-unsigned-$CI_COMMIT_SHORT_SHA-$CI_JOB_ID"
    when: always
    expire_in: 3 days
    access: developer
    paths:
      - gitlab-logs/
      - gitlab-artifacts/
