stages:
  - release-context
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

default:
  image:
    name: $GPUFLOW_CI_IMAGE
    entrypoint: [""]
  tags:
    - linux-docker
  interruptible: false

variables:
  GOMAXPROCS: "2"
  DOCKER_BUILDKIT: "1"
  GPUFLOW_CI_IMAGE: gitlab.gpuflow.test:5055/gpuflow/gpuflow/ci-tools@sha256:3a0babf52685e4b98d4711b5c62537f6ce8a55657b0a42da6cc777a18b8b6399
  BUILDKIT_IMAGE: moby/buildkit:v0.28.1@sha256:a82d1ab899cda51aade6fe818d71e4b58c4079e047a0cf29dbb93b2b0465ea69
  OFFLINE_DIND_IMAGE: docker:29.3.1-dind@sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0
  # DOCKER_HOST is supplied by the isolated local runner, never a host socket.

formal-tag-guard:
  stage: release-context
  rules:
    - if: '$CI_COMMIT_TAG'
  environment:
    name: release-publishing
    action: prepare
  script:
    - python3 scripts/gitlab-release.py guard
  artifacts:
    access: developer
    expire_in: 90 days
    paths: [gitlab-evidence/formal-tag-guard.json]

full-signed-build:
  stage: build
  resource_group: gpuflow-full-signed-build
  environment:
    name: release-signing
    action: prepare
  timeout: 2h
  needs:
    - job: formal-tag-guard
      optional: true
      artifacts: true
  script:
    - node --test scripts/check-community-boundary.test.mjs
    - node scripts/check-community-boundary.mjs
    - python3 scripts/test-gitlab-release.py
    - bash scripts/gitlab-full-build.sh
  artifacts:
    name: "gpuflow-full-signed-$CI_COMMIT_SHORT_SHA-$CI_JOB_ID"
    when: always
    expire_in: 90 days
    access: developer
    paths:
      - gitlab-logs/
      - gitlab-artifacts/full/

publish-version:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
  resource_group: gpuflow-full-signed-build
  needs:
    - job: formal-tag-guard
      artifacts: true
    - job: full-signed-build
      artifacts: true
  environment:
    name: release-publishing
  script:
    - bash scripts/gitlab-publish-version.sh
